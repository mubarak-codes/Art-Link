
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mubarak / Holy The Artist — Links</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <main class="container">
        
        <!-- Header / Profile Info -->
        <header class="profile-header">
            <div class="avatar-container">
                <!-- High quality artist avatar with fallback -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9lB1bXzb307X07x1oY2_3SQD3xAfxIwR1p9xGPIQXDLmT4zUTf_v4sYk&s=10" 
                     alt="Mubarak / Holy The Artist" 
                     class="avatar-img"
                     onerror="this.src='https://placehold.co/200x200/141b1f/6ee7b7?text=Holy'">
                <div class="verified-badge" title="Verified Artist">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
            <h1 class="profile-name">Mubarak Owosheni</h1>
            <p class="profile-title">Holy The Artist</p>
            <p class="profile-bio">I'm an ASCII Artist, I make art using letters, numbers and symbols </p>
        </header>

        <!-- Main Links List -->
        <section class="links-wrapper" aria-label="Key Links">
            
            <!-- Link 1: Portfolio -->
            <a href="https://holy-the-artist-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer" class="link-card featured">
                <div class="link-content">
                    <div class="link-icon">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <div class="link-details">
                        <span class="link-title">Portfolio</span>
                        <span class="link-subtitle">Explore artworks, projects & gallery</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
            </a>

            <!-- Link 2: Store -->
            <a href="https://holytheartist.vercel.app" target="_blank" rel="noopener noreferrer" class="link-card featured">
                <div class="link-content">
                    <div class="link-icon">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                    <div class="link-details">
                        <span class="link-title">Art Store & Prints</span>
                        <span class="link-subtitle">Shop original works & prints</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
            </a>

            <!-- Link 3: Contact / Inquiries -->
            <a href="mailto:mubaraktheartist@gmail.com" class="link-card">
                <div class="link-content">
                    <div class="link-icon">
                        <i class="fa-envelope fa-regular"></i>
                    </div>
                    <div class="link-details">
                        <span class="link-title">Commissions & Inquiries</span>
                        <span class="link-subtitle">Get in touch for custom art projects</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

        </section>

        <!-- Social Media Links Section -->
        <nav class="socials-wrapper" aria-label="Social Profiles">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Twitter / X">
                <i class="fa-brands fa-x-twitter"></i>
                <wa-icon name="x-twitter" family="brands"></wa-icon>
            </a>
            <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Spotify">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            
        </nav>

        <!-- Footer -->
        <footer>
            <p>© <span id="year"></span> Mubarak / Holy The Artist</p>
        </footer>

    </main>

    <!-- Simple Script for dynamic current year -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
